version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: college_review_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=college_reviews
    volumes:
      - mongodb_data:/data/db
    networks:
      - college_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/college_reviews --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college_review_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/college_reviews
      - JWT_SECRET=college_review_system_secure_jwt_secret_key_2026_xyz
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=200
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - college_network

volumes:
  mongodb_data:
    driver: local

networks:
  college_network:
    driver: bridge
